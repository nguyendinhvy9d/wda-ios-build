name: build-wda
on:
  workflow_dispatch: {}
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout WebDriverAgent (appium)
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
      - name: Build for testing (no signing)
        run: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Package into unsigned ipa
        run: |
          set -e
          APP=$(find build/Build/Products -name 'WebDriverAgentRunner-Runner.app' -maxdepth 3 | head -1)
          echo "app = $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr WebDriverAgentRunner.ipa Payload
          ls -la WebDriverAgentRunner.ipa
      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
          if-no-files-found: error
