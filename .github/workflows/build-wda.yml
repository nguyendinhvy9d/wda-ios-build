# Dựng WebDriverAgent thành file .ipa KHÔNG KÝ trên "Mac đám mây" (GitHub Actions) — để cài vào iPhone jailbreak.
# Vì sao: WebDriverAgent bắt buộc biên dịch trên macOS/Xcode một lần. Không có Mac → dùng máy ảo macOS miễn phí của GitHub.
# Máy đã jailbreak + AppSync nên KHÔNG cần ký (CODE_SIGNING_ALLOWED=NO).
name: build-wda
on:
  workflow_dispatch: {}        # bấm chạy tay (hoặc gh workflow run)
jobs:
  build:
    runs-on: macos-14          # có sẵn Xcode
    steps:
      - name: Lấy mã nguồn WebDriverAgent (appium)
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
      - name: Biên dịch (build-for-testing, không ký)
        run: |
          set -e
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Đóng gói thành .ipa
        run: |
          set -e
          APP=$(find build/Build/Products -name 'WebDriverAgentRunner-Runner.app' -maxdepth 3 | head -1)
          echo "app = $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr WebDriverAgentRunner.ipa Payload
          ls -la WebDriverAgentRunner.ipa
      - name: Nộp file .ipa làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
          if-no-files-found: error
